<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}API Legal{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    html { background: #fff; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; background: #fff; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 0.75rem; margin-bottom: 1.5rem; }
    header a { color: inherit; text-decoration: none; font-weight: 600; }
    nav a { margin-left: 1rem; color: #333; font-size: 0.9rem; }
    nav form { display: inline; margin-left: 1rem; }
    nav form button.enlace {
      background: none; border: none; padding: 0; margin: 0; font: inherit;
      color: #333; font-size: 0.9rem; cursor: pointer; text-decoration: none;
    }
    nav form button.enlace:hover { text-decoration: underline; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid #eee; }
    th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.02em; color: #666; }
    tr.inactivo { color: #999; }
    .etiqueta { display: inline-block; padding: 0.1rem 0.6rem; border-radius: 999px; font-size: 0.75rem; background: #eef0ff; }
    .etiqueta-secundaria { background: #f0f0f0; color: #555; margin-left: 0.3rem; }
    .etiqueta-manual { background: #fff4d6; color: #8a5a00; font-weight: 600; }
    .ayuda { font-size: 0.8rem; color: #777; margin: 0.2rem 0 0; }
    form.formulario { max-width: 480px; }
    form.formulario label { display: block; margin-top: 0.9rem; font-size: 0.85rem; color: #333; }
    form.formulario input, form.formulario select, form.formulario textarea {
      width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #ccc; border-radius: 4px; font: inherit; box-sizing: border-box;
    }
    form.formulario button { margin-top: 1.25rem; padding: 0.55rem 1.1rem; border: none; border-radius: 4px; background: #1a1a1a; color: #fff; cursor: pointer; font-size: 0.95rem; }
    form.formulario button:hover { background: #333; }
    .error { background: #fdecea; color: #a3231d; padding: 0.6rem 0.9rem; border-radius: 4px; margin-top: 1rem; }
    .paginacion { margin-top: 1rem; display: flex; gap: 1.25rem; font-size: 0.9rem; }
    .vacio { color: #777; margin-top: 1rem; }
  </style>
</head>
<body>
  {% block cuerpo %}{% endblock %}
</body>
</html>
